name: release-automation

# DSR is the release authority. This manual, read-only fallback validates the
# privacy gate and reports the exact DSR command; it never creates or pushes a
# tag and therefore cannot queue a nonfunctional Actions release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject tracked private media and transcript-like artifacts
        env:
          FRANKEN_WHISPER_REVIEWED_LEGACY_ARTIFACTS: ${{ vars.FRANKEN_WHISPER_REVIEWED_LEGACY_ARTIFACTS }}
        run: |
          set -euo pipefail
          guard_bin="${RUNNER_TEMP}/franken-whisper-repository-privacy-guard"
          rustc --edition=2024 scripts/check_repository_privacy.rs -o "$guard_bin"
          "$guard_bin" --tracked

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Unable to parse version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Report canonical release command
        run: |
          echo "Canonical release path:"
          echo "  dsr release franken_whisper v${{ steps.version.outputs.version }}"
