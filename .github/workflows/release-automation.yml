name: release-automation

# Watches the main branch for a Cargo.toml version bump and auto-creates a
# matching `vX.Y.Z` tag. The tag then triggers dist.yml. Modeled on the
# destructive_command_guard release-automation pattern.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject tracked private media and transcript-like artifacts
        env:
          FRANKEN_WHISPER_REVIEWED_LEGACY_ARTIFACTS: ${{ vars.FRANKEN_WHISPER_REVIEWED_LEGACY_ARTIFACTS }}
        run: |
          set -euo pipefail
          guard_bin="${RUNNER_TEMP}/franken-whisper-repository-privacy-guard"
          rustc --edition=2024 scripts/check_repository_privacy.rs -o "$guard_bin"
          "$guard_bin" --tracked

      - name: Read version from Cargo.toml
        if: github.event_name != 'pull_request'
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Unable to parse version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read latest tag
        if: github.event_name != 'pull_request'
        id: latest
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: github.event_name != 'pull_request' && steps.latest.outputs.latest != format('v{0}', steps.version.outputs.version)
        run: |
          tag="v${{ steps.version.outputs.version }}"
          echo "Creating release tag $tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Skip (already tagged)
        if: github.event_name != 'pull_request' && steps.latest.outputs.latest == format('v{0}', steps.version.outputs.version)
        run: |
          echo "Latest tag matches Cargo.toml version; nothing to do."
