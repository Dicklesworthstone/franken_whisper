name: dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (vX.Y.Z). DSR is the canonical release path.'
        required: true
        type: string

# DSR is the canonical build/release authority. This workflow is a manually
# dispatched, fail-closed fallback and never auto-runs on tag pushes.
env:
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: write

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reject tracked private media and transcript-like artifacts
        env:
          FRANKEN_WHISPER_REVIEWED_LEGACY_ARTIFACTS: ${{ vars.FRANKEN_WHISPER_REVIEWED_LEGACY_ARTIFACTS }}
        run: |
          set -euo pipefail
          guard_bin="${RUNNER_TEMP}/franken-whisper-repository-privacy-guard"
          rustc --edition=2024 scripts/check_repository_privacy.rs -o "$guard_bin"
          "$guard_bin" --tracked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # franken_whisper pins to nightly via rust-toolchain.toml; install
      # the nightly channel up front so cargo doesn't have to fetch it on
      # demand (and so we get rustfmt + clippy on the same channel).
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy

      - name: Validate requested release version
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "v$cargo_version" = "$RELEASE_VERSION"

      - name: Prepare exact sibling path dependencies
        run: scripts/prepare_release_siblings.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  build:
    needs: [privacy, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_arch: linux_amd64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_arch: linux_arm64
            archive_ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            os_arch: darwin_amd64
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            os_arch: darwin_arm64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_arch: windows_amd64
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # franken_whisper pins nightly via rust-toolchain.toml; matching that
      # here lets the cross-compile target install live on the same channel
      # cargo will actually use for the build.
      - name: Install pinned Rust nightly with target
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly-2026-07-20
          targets: ${{ matrix.target }}

      - name: Prepare exact sibling path dependencies
        shell: bash
        run: scripts/prepare_release_siblings.sh

      - name: Build release binaries
        run: cargo build --locked --release --bins --target ${{ matrix.target }}

      - name: Strip binaries (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/franken_whisper target/${{ matrix.target }}/release/fw

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        # install.sh strips the leading "v" before constructing the asset
        # name (`franken_whisper-${VERSION#v}-${os}_${arch}.tar.gz`), so we
        # must do the same here. The required dispatch input is validated by
        # the blocking test job before any build runs.
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION_NO_V="${RELEASE_VERSION#v}"
          ARCHIVE="franken_whisper-${VERSION_NO_V}-${{ matrix.os_arch }}.${{ matrix.archive_ext }}"
          tar -czf "dist/$ARCHIVE" \
            -C "target/${{ matrix.target }}/release" franken_whisper fw \
            -C "$GITHUB_WORKSPACE" README.md LICENSE THIRD_PARTY_NOTICES.md AGENTS.md
          cd dist
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $versionNoV = "${env:RELEASE_VERSION}" -replace '^v',''
          $archive = "franken_whisper-${versionNoV}-${{ matrix.os_arch }}.${{ matrix.archive_ext }}"
          $binaries = @(
            "target/${{ matrix.target }}/release/franken_whisper.exe",
            "target/${{ matrix.target }}/release/fw.exe",
            "README.md",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "AGENTS.md"
          )
          Compress-Archive -Path $binaries -DestinationPath "dist/$archive"
          Push-Location dist
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ASCII "$archive.sha256"
          Pop-Location

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate aggregate checksums-sha256.txt
        # install.sh expects this filename verbatim:
        #   https://github.com/${OWNER}/${REPO}/releases/download/${VERSION}/checksums-sha256.txt
        # with one `<sha256>  <archive_name>` line per binary asset.
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          rm -f checksums-sha256.txt
          archives=(franken_whisper-*.tar.gz franken_whisper-*.zip)
          test "${#archives[@]}" -eq 5
          for f in "${archives[@]}"; do
            shasum -a 256 "$f" >> checksums-sha256.txt
          done
          cat checksums-sha256.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign release archives (sigstore bundle)
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          for f in franken_whisper-*.tar.gz franken_whisper-*.zip; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Copy install scripts to dist
        run: cp install.sh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-homebrew-tap:
    name: Notify Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 5
    continue-on-error: true
    env:
      HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Check for token
        id: check
        run: |
          if [[ "${{ env.HAS_TOKEN }}" != "true" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not configured, skipping notification"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from tag
        if: steps.check.outputs.skip != 'true'
        id: version
        run: echo "version=${RELEASE_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Trigger formula update
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: Dicklesworthstone/homebrew-tap
          event-type: formula-update
          client-payload: |
            {
              "tool": "franken_whisper",
              "version": "${{ steps.version.outputs.version }}"
            }
