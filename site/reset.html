<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>franken_whisper: reset</title>
<style>
  body { margin: 0; background: #060b09; color: #e6edf3;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: grid; place-items: center; min-height: 100vh; }
  main { max-width: 32rem; padding: 2rem; }
  button { padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid #2d333b;
           background: #10b981; color: #04110b; font: inherit; font-weight: 600; cursor: pointer; }
  .out { margin-top: 1rem; color: #9aa7b3; font-size: 0.9rem; white-space: pre-line; }
  a { color: #34d399; }
</style>
</head>
<body>
<main>
  <h1>Reset franken_whisper</h1>
  <p>This page loads <strong>no WebAssembly</strong>, so a crashing engine cannot take
  the escape hatch down with it. It wipes the cached model bytes (about 2 GB in
  this browser's private storage), the run calibration, and any leftover state,
  and then you can <a href="./">go back</a> and start clean.</p>
  <button id="wipe">Wipe caches</button>
  <div class="out" id="out"></div>
</main>
<script>
  document.getElementById("wipe").addEventListener("click", async () => {
    const out = [];
    try {
      const root = await navigator.storage.getDirectory();
      try {
        await root.removeEntry("fw-models", { recursive: true });
        out.push("deleted the cached models (OPFS fw-models/)");
      } catch {
        out.push("no cached models found");
      }
      for (const name of await caches.keys()) {
        await caches.delete(name);
        out.push(`deleted cache "${name}"`);
      }
      localStorage.removeItem("fw-run-calibration-v1");
      out.push("cleared run calibration");
      out.push("done. You can go back now.");
    } catch (e) {
      out.push(`error: ${e}`);
    }
    document.getElementById("out").textContent = out.join("\n");
  });
</script>
</body>
</html>
