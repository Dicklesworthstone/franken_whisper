# Browser bindings for the franken_whisper native engine (bd-m2jm, W2).
#
# Standalone crate (NOT a workspace member of the parent package, which ships
# to crates.io with a whitelisted include set). It mounts the parent's
# `src/native_engine` sources via `#[path]` so there is exactly ONE code path:
# the wasm build compiles the same bytes the native binary ships, with the
# `plat` seam (src/native_engine/plat.rs) supplying the browser-safe clock and
# serial thread scope.
[package]
name = "fw-wasm"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
description = "franken_whisper browser bindings: the native Whisper engine compiled to WASM"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ft-kernel-cpu = { version = "0.1.0", path = "../../frankentorch/crates/ft-kernel-cpu" }
ft-core = { version = "0.1.0", path = "../../frankentorch/crates/ft-core" }
half = { version = "2.7", features = ["std"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# In-crate mp3/m4a/wav decode for the browser demo (pure Rust, wasm-clean).
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "pcm"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
