[package]
name = "franken_whisper"
version = "0.9.3"
edition = "2024"
license-file = "LICENSE"
description = "Native Rust Whisper ASR and speaker diarization with agent-first NDJSON and durable local workflows"
repository = "https://github.com/Dicklesworthstone/franken_whisper"
homepage = "https://github.com/Dicklesworthstone/franken_whisper"
documentation = "https://docs.rs/franken_whisper"
readme = "README.md"
keywords = ["whisper", "speech-to-text", "diarization", "asr", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE.sortformer.txt",
    "/THIRD_PARTY_NOTICES.md",
    "/src/**",
    "!/src/.DS_Store",
    "/models/**",
    "/scripts/convert_to_safetensors.py",
    "/scripts/export_sortformer_activations.py",
    "/docs/native_engine_contract.md",
    "/docs/NEGATIVE_EVIDENCE.md",
]

[features]
default = []
tui = ["dep:ftui"]

# Two binaries from the same entry point: the full name and the short `fw`
# alias agents and humans actually type. Listing them explicitly disables the
# implicit package-named bin, so both are declared here.
#
# NOTE: cargo emits `warning: src/main.rs found to be present in multiple build
# targets` — this is EXPECTED and INTENTIONAL (one shared entry point, two
# installable names). Do NOT "fix" it by dropping a bin (breaks the `fw`/
# `franken_whisper` dual name that installers + docs rely on) or by refactoring
# main into the lib behind thin per-bin wrappers (a large, CLI-risky change for a
# cosmetic warning). Accept the warning.
[[bin]]
name = "franken_whisper"
path = "src/main.rs"

[[bin]]
name = "fw"
path = "src/bin/fw.rs"

[dependencies]
ctrlc = "3.4"
base64 = "0.22.1"
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.5.31", features = ["derive", "env"] }
crc32fast = "1.4"
flate2 = "1.1.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.17.1"
thiserror = "2.0.12"
uuid = { version = "1.15.1", features = ["serde", "v4"] }
sha2 = "0.10"
which = "7.0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hound = "3.5.1"
symphonia = { version = "0.5.5", features = ["mp3", "aac", "isomp4", "ogg", "flac", "vorbis", "wav", "pcm"] }
# Persistent-pool data parallelism for the decoder GEMV (mlp/logits): rayon's
# global pool avoids the per-call `std::thread::scope` spawn that forced L9 to
# serialize the per-token mid GEMVs (bd-6qih, L11). Already in the tree via
# ft-kernel-cpu; pinned to the same minor.
rayon = "1.10"

asupersync = { version = "0.3.4", default-features = false, features = ["tls-webpki-roots"] }
franken-kernel = "0.3.4"
franken-evidence = "0.3.4"
franken-decision = "0.3.4"
fsqlite = { version = "0.3.0", path = "../frankensqlite/crates/fsqlite" }
fsqlite-types = { version = "0.3.0", path = "../frankensqlite/crates/fsqlite-types" }

# FrankenTorch compute kernels for the in-process native whisper engine
# (rayon-parallel GEMM, softmax, gelu; f16 storage types). These are
# first-party FrankenSuite crates — see the bd-frp7 epic.
ft-kernel-cpu = { version = "0.1.0", path = "../frankentorch/crates/ft-kernel-cpu", package = "frankentorch-kernel-cpu" }
ft-core = { version = "0.1.0", path = "../frankentorch/crates/ft-core", package = "frankentorch-core" }
# FastEnhancer-S speech denoiser (default pipeline stage when its pinned
# artifact is present; see src/denoise.rs). Zero required deps of its own.
ftts-kernels = { version = "0.1", path = "../frankentts/crates/ftts-kernels", default-features = false }
# Direct dep on `half` (same crate ft-core re-exports as `Float16`) for its
# `HalfFloatSliceExt::convert_to_f32_slice` SIMD bulk f16->f32 dequant — the
# `std` feature enables runtime aarch64 `fp16` / x86 `f16c` vector paths used
# by the f16-compute GEMV kernels (nn::gemv_f16). Pinned to ft-core's version.
half = { version = "2.7", features = ["std"] }

ftui = { version = "0.5.0", path = "../frankentui/crates/ftui", default-features = false, features = ["crossterm"], optional = true }

# Safe handle-relative openat, ownership checks, and no-clobber rename
# publication are unavailable in std. This narrowly featured target-specific
# edge closes that capability gap while preserving the unsafe-code prohibition.
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

# std does not expose race-free Windows Job Object assignment. This narrowly
# featured safe wrapper spawns suspended, assigns the child before it can create
# descendants, and retains the job handle after the root exits.
[target.'cfg(windows)'.dependencies]
process-wrap = { version = "9.1.0", default-features = false, features = ["std", "job-object"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Targeted lint hardening — pedantic/nursery deferred until missing-docs addressed
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
semicolon_if_nothing_returned = "warn"
unused_self = "warn"

# GPU acceleration on Apple Silicon: the native engine's matmuls auto-offload to
# the Metal tiled-GEMM kernel at runtime when a GPU is present (see
# native_engine::nn). macOS-only and isolated behind ft-kernel-metal's safe API,
# so franken_whisper keeps `#![deny(unsafe_code)]`. Non-macOS targets never see
# this dep and stay on the optimized CPU path.
[target.'cfg(target_os = "macos")'.dependencies]
ft-kernel-metal = { version = "0.1.0", path = "../frankentorch/crates/ft-kernel-metal" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# For the f16_gemv_dequant bench to construct `Float16` weights directly.
ft-core = { version = "0.1.0", path = "../frankentorch/crates/ft-core", package = "frankentorch-core" }
# FastEnhancer-S speech denoiser (default pipeline stage when its pinned
# artifact is present; see src/denoise.rs). Zero required deps of its own.
ftts-kernels = { version = "0.1", path = "../frankentts/crates/ftts-kernels", default-features = false }
# For the hugepage_gemv_probe (madvise(MADV_HUGEPAGE) A/B on weight streaming).
# Already a transitive dependency; dev-only, does not affect the shipped binary.
libc = "0.2"

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "normalize_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "tty_bench"
harness = false

[[bench]]
name = "sync_bench"
harness = false

[[bench]]
name = "native_engine_bench"
harness = false

# Profiling build: full optimization + symbols/frame pointers so samplers
# (samply/Instruments) can attribute frames. Never profile the size-optimized
# `release` profile (opt-level="z", strip=true → useless flames).
[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false
panic = "unwind" # deliberate override of release's abort: scoped-thread panics must unwind for clean bench/profiler teardown

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
