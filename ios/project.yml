# xcodegen spec for the FrankenWhisper iOS app. Regenerate with: (cd ios && xcodegen generate)
name: FrankenWhisper
options:
  bundleIdPrefix: com.frankenwhisper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    # The Rust simulator library is arm64-only (Apple Silicon hosts). Building the
    # x86_64 sim slice would need the x86_64-apple-ios Rust target added to
    # ios/build-rust.sh; until someone needs an Intel Mac, exclude it.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: AU8V2Z6NKY
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  FrankenWhisper:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - framework: FwCore.xcframework
        embed: false
    entitlements:
      path: FrankenWhisper.entitlements
      properties:
        # 8 GB devices grant ~4-5 GB with this instead of the ~3.3 GB default. The
        # working set is ~0.9 GB of q8_0 whisper weights + ~0.5 GB Sortformer +
        # decode scratch, plus transient load buffers; the headroom keeps jetsam
        # away during model load.
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FrankenWhisper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: >-
          Recordings are transcribed entirely on this device by a local model.
          No audio, transcript, or anything else ever leaves your phone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
