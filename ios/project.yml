# xcodegen spec for the FrankenWhisper iOS app. Regenerate with: (cd ios && xcodegen generate)
name: FrankenWhisper
options:
  bundleIdPrefix: com.frankenwhisper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    # The Rust simulator library is arm64-only (Apple Silicon hosts). Building the
    # x86_64 sim slice would need the x86_64-apple-ios Rust target added to
    # ios/build-rust.sh; until someone needs an Intel Mac, exclude it.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: AU8V2Z6NKY
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  FrankenWhisper:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenwhisper.FrankenWhisper
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrankenWhisper.entitlements
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "."]
        SUPPORTS_MACCATALYST: false
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          ENABLE_NS_ASSERTIONS: false
    sources:
      - Sources
      - Shared
      - Assets.xcassets
    dependencies:
      - framework: FwCore.xcframework
        embed: false
      - target: FrankenWhisperKeyboard
        embed: true
    entitlements:
      path: FrankenWhisper.entitlements
      properties:
        # 8 GB devices grant ~4-5 GB with this instead of the ~3.3 GB default. The
        # working set is ~0.9 GB of q8_0 whisper weights + ~0.5 GB Sortformer +
        # decode scratch, plus transient load buffers; the headroom keeps jetsam
        # away during model load.
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.application-groups:
          - group.com.frankenwhisper.dictation
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FrankenWhisper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.frankenwhisper.FrankenWhisper.dictation
            CFBundleURLSchemes:
              - frankenwhisper
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: >-
          Recordings are transcribed entirely on this device by a local model.
          No audio, transcript, or anything else ever leaves your phone.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FrankenWhisperKeyboard:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenwhisper.FrankenWhisper.Keyboard
        PRODUCT_NAME: FrankenWhisper Keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrankenWhisperKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    sources:
      - Keyboard
      - Shared
    entitlements:
      path: FrankenWhisperKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.frankenwhisper.dictation

  FrankenWhisperTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    sources:
      - Tests
      - Sources/LiveUtteranceDetector.swift
      - Sources/LiveSpectrum.swift
